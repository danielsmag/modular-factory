[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modular-factory"
description = "A software factory for a git repository"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["pyyaml>=6"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/danielsmag/modular-factory"
Documentation = "https://danielsmag.github.io/modular-factory/docs/"
Issues = "https://github.com/danielsmag/modular-factory/issues"

[project.scripts]
mfactory = "modular_factory.bootstrap:main"

[tool.hatch.version]
source = "regex"
path = "core/VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/modular_factory"]

[tool.hatch.build.targets.wheel.shared-data]
"core" = "share/modular-factory/core"
"adapters" = "share/modular-factory/adapters"
"web" = "share/modular-factory/web"
"LICENSE" = "share/modular-factory/LICENSE"
"NOTICE" = "share/modular-factory/NOTICE"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/modular_factory",
  "core",
  "adapters",
  "web",
  "LICENSE",
  "NOTICE",
  "README.md",
  "pyproject.toml",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"

[tool.basedpyright]
extraPaths = ["core/lib"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["core/bin/factory", "core/bin/mfactory"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
