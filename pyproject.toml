[project]
name = "modular-factory"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["pyyaml>=6"]

[tool.uv]
package = false   # a folder copied into each repository, not a package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"

[tool.basedpyright]
extraPaths = ["core/lib"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["core/bin/factory", "core/bin/mfactory"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
