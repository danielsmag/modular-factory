[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"

[tool.pyright]
extraPaths = ["core/lib"]
pythonVersion = "3.11"

[tool.basedpyright]
extraPaths = ["core/lib"]
pythonVersion = "3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["core/bin/factory", "core/bin/mfactory"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
