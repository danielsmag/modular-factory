# The factory's defaults. A project's factory.toml is merged on top of this
# file, key by key, so it holds only what the project changes.
# Don't edit this copy: `factory upgrade` replaces it.

schema = 1

[project]
description = ""          # what the project is for; intake uses it to decide what belongs
base_branch = "master"
merge_method = "squash"   # merge, squash or rebase
pr_title = ""             # example pull request title; empty means the spec title
pr_title_pattern = ""     # when set, done refuses a READY build whose title does not match
issue_link = "refs"       # "refs": the issue stays open until someone closes it; "closes": GitHub closes it on merge
branch_prefix = "factory/" # concatenated with the job id; the slash is part of the prefix
branch_pattern = ""        # when set, the branch name must fullmatch before the branch is created

[tools]
enabled = ["claude"]      # claude, cursor, codex

[tools.claude]
stop_hook = false         # run the checks when the build agent stops, as a nudge
cost = true               # per-job cost, read from Claude Code's transcripts
plan_usage = true         # record /usage plan limits with a status line in .claude/settings.local.json
resume_builder = false    # wake the job's builder with SendMessage in later rounds instead of starting a new one
agent_tools = ["all"]     # tools every agent may use: "all", or names such as ["default", "WebFetch", "mcp__github__*"]

[tools.codex]
intake_shell = false      # true lets intake run commands, if your Codex can't read files without a shell

[run]
concurrency = 3           # jobs this project works on at once
start = "intake"          # the step a new job starts in
escalate_to = "escalated" # the human step a job goes to when an edge's max is reached
report_problems = false   # true opens a GitHub issue (without the queue label) when a job escalates
pick = "all"              # "mine": only issues the operator opened or is assigned to
authors = []              # also pick issues these logins opened; "@me" is the operator
assignees = []            # also pick issues assigned to these logins; "@me" is the operator

[workspace]
concurrency = 3           # new and resume rows across every project; workspace.toml or --concurrency overrides

[checks]
commands = []             # worktree cwd; FACTORY_CHECKOUT is the main checkout; first failure stops
timeout_minutes = 30

[tracker]
kind = "github"           # where jobs come from and where people reply: "github" or "jira"

# Read only with kind = "jira". Pull requests stay on GitHub.
[tracker.jira]
site = ""                 # the Jira site, such as https://acme.atlassian.net
board = 0                 # the kanban board's id; its saved filter scopes the queue
jql = ""                  # optional, ANDed with the board's filter
email_env = "JIRA_EMAIL"         # environment variables that hold the account and its API token.
token_env = "JIRA_API_TOKEN"     # Never put the values themselves in factory.toml
issue_type = "Task"       # the type of an issue the factory files itself
maintainers = []          # Jira account ids; empty means anyone who can be assigned the issue
# [tracker.jira.columns] maps a step, an end state or `queue` to a Jira status. It has no default.

[labels]
queue = "factory"
needs_info = "factory:needs-info"
needs_human = "factory:needs-human"

[paths]
worktrees = ".worktrees"
protected = []            # extra fnmatch patterns no job may modify or delete

[ports]
base = 5100               # each job gets `step` ports for dev servers
step = 10

[skills]
all = []                  # skills every agent reads; "all" means every skill on this machine

[rules]
all = ["all"]             # every AGENTS.md, CLAUDE.md, and rule file found in the repo and at home

# ---- The pipeline ----------------------------------------------------------

[steps.intake]
type = "agent"
on = { ACCEPT = "spec", NEEDS-INFO = { to = "ask-author", max = 2 }, REJECT = "rejected" }

[steps.ask-author]
type = "human"
who = "author"
ask = "intake has questions for the author"
shows = "intake.md"
on = { ANSWER = "intake", REJECT = "rejected" }

[steps.spec]
type = "agent"
on = { DONE = "spec-approval" }

[steps.spec-approval]
type = "human"
enabled = false
skip = "APPROVE"
who = "maintainer"
ask = "approve the spec before it is built"
shows = "spec.md"
on = { APPROVE = "build", CHANGES = { to = "spec", max = 3 }, REJECT = "rejected" }

[steps.build]
type = "agent"
port = true
# The default AGENTS.md falls back to CLAUDE.md, and is skipped when neither exists.
rules = ["AGENTS.md", "user:CLAUDE.md"]
on = { READY = "gate", BLOCKED = "escalated" }

[steps.gate]
type = "checks"
on = { PASS = "review", FAIL = { to = "debug", max = 2 } }

[steps.debug]
type = "agent"
enabled = false
skip = "FOUND"
on = { FOUND = "build", UNKNOWN = "build" }

[steps.review]
type = "review"
on = { PASS = "approve", CHANGES = { to = "build", max = 2 } }

[steps.approve]
type = "agent"
on = { APPROVE = "ready-to-merge", ESCALATE = "escalated" }

[steps.ready-to-merge]
type = "human"
who = "maintainer"
ask = "approved: merge it yourself"
shows = "decision.md"
pr_ready = true
on = { FEEDBACK = { to = "build", max = 3 }, REJECT = "rejected" }

[steps.merge]
type = "merge"
enabled = false          # a maintainer merges; turn this on only with approve's APPROVE edge
skip = "MERGED"
on = { MERGED = "ready-to-verify", FAILED = "escalated" }

[steps.ready-to-verify]
type = "human"
enabled = false          # turn on when a person must say the deploy is live before verify runs
skip = "VERIFY"
who = "maintainer"
ask = "deployed: verify it"
on = { VERIFY = "verify", REJECT = "rejected" }

[steps.verify]
type = "verify"
enabled = false
skip = "PASS"
after = "merge"           # "merge" or "deploy"
commands = []
agent = false
retries = 1
on_failure = "comment"    # "comment", "issue" or "revert-pr"
wait = ""                 # for after = "deploy": exits 0 once FACTORY_MERGE_SHA is live
timeout_minutes = 20
url = ""
on = { PASS = "done", FAIL = "failed", BLOCKED = { to = "ready-to-verify", max = 3 } }

[steps.escalated]
type = "human"
who = "maintainer"
ask = "this job needs a maintainer"
pr_ready = true
on = { FEEDBACK = "build", REJECT = "rejected" }

# ---- Reviewers -------------------------------------------------------------
# A reviewer listed under a surface runs on jobs with that surface. Every other
# reviewer runs on every job.

[reviewers.code]

[reviewers.security]

# ux and ui are for projects with a user interface. Switch them on, with their surface.
[reviewers.ux]
enabled = false
port = true

[reviewers.ui]
enabled = false
port = true

[surfaces.ui]
enabled = false
when = "a user will see the change on a page or screen"
reviewers = ["ux", "ui"]

[surfaces.security]
when = "it touches auth, permissions, user input reaching queries, shells or HTML, secrets, or payments"
reviewers = ["security"]
