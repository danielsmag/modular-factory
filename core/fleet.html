<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>factory fleet</title>
<style>
:root {
  --bg: #0b0b0b;
  --panel: #151515;
  --panel-2: #1b1b1b;
  --line: #2a2a2a;
  --line-2: #3a3a3a;
  --text: #f2f2f2;
  --muted: #9a9a9a;
  --accent: #ff4a26;
  --good: #2fbf71;
  --bad: #ff5a4f;
  --warn: #e0a83a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font: 14px/1.45 var(--sans); border-top: 3px solid var(--accent);
  background-image: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(255, 255, 255, .018) 3px 4px);
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.top {
  display: flex; align-items: center; gap: 28px; padding: 14px 28px; max-width: 1280px; margin: 0 auto;
  font-family: var(--mono); background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font: 600 19px var(--sans); letter-spacing: -.01em; text-decoration: none; flex: none; }
.brand svg { width: 22px; height: 22px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: 11px var(--mono); border: 1px solid var(--line-2); padding: 3px 9px; border-radius: 3px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); padding: 6px 10px; min-width: 210px; background: var(--bg); }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: 13px var(--mono); }
.search input::placeholder { color: var(--muted); }
kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-2); padding: 0 5px; border-radius: 2px; white-space: nowrap; }
.page { max-width: 1280px; margin: 0 auto; padding: 22px 28px 40px; min-width: 0; }
.live { font: 11px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.live.stale::before { background: var(--bad); }
h2 { font: 500 16px var(--sans); margin: 0; }
.sub { color: var(--muted); font-size: 12px; margin: 3px 0 12px; }
.path { color: var(--muted); font: 12px var(--mono); margin: 4px 0 8px; word-break: break-all; }
.error { color: var(--bad); font: 12px var(--mono); margin: 0 0 8px; }
.project { margin-bottom: 28px; }
.ext { font-family: var(--mono); font-size: 12px; text-decoration: none; border-bottom: 1px dotted var(--line-2); }
.ext:hover { color: var(--accent); border-color: var(--accent); }
.kanban { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
.kcol { flex: 0 0 220px; min-width: 220px; }
.kcol-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.kcol-head h3 { margin: 0; font: 600 13px var(--sans); flex: none; }
.kcol-head .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px var(--mono); color: var(--muted); }
.kcol-head .count { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.kcol.human .kcol-head { border-bottom-color: var(--accent); }
.kcol.human h3 { color: var(--accent); }
.kcol.done h3 { color: var(--muted); }
.kempty { color: var(--muted); font: 12px var(--mono); margin: 4px 2px; }
.kcard { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 10px 8px; margin-bottom: 8px; }
.kcard:hover { border-color: var(--line-2); }
.kcard.on { box-shadow: inset 2px 0 var(--accent); }
.kcard.live { border-color: #5a3a32; }
.kcard.human { border-color: var(--accent); }
.kcard.done { opacity: .72; }
.kcard.rejected .feature { text-decoration: line-through; text-decoration-color: var(--muted); }
.kcard .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.kcard .num { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--muted); }
.kcard .flag { margin-left: auto; font: 600 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.kcard .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; overflow-wrap: anywhere; }
.kcard .links { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.kcard .meta { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 8px; font: 11px var(--mono); color: var(--muted); }
.kcard .meta .hot { color: var(--bad); }
.kcard .meta .warn { color: var(--warn); }
.kcard .hint { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.round { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
.round .r { width: 22px; flex: none; font: 10px var(--mono); color: var(--muted); }
.kchip { flex: 1; min-width: 0; text-align: center; font: 10px var(--mono); padding: 2px 0; border-radius: 3px; border: 1px dashed var(--line-2); color: var(--muted); }
.kchip.gate { flex: 0 0 38px; }
.kchip.PASS { border: 1px solid transparent; color: var(--good); background: rgba(47, 191, 113, .14); }
.kchip.FAIL, .kchip.bad { border: 1px solid transparent; color: var(--bad); background: rgba(255, 90, 79, .14); }
.kchip.CHANGES { border: 1px solid transparent; color: var(--warn); background: rgba(224, 168, 58, .16); }
.kchip.wait { border-style: solid; border-color: var(--accent); color: var(--accent); }
.overlay { position: fixed; inset: 0; z-index: 30; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(920px, 100%); background: #0e0e0e; border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.d-head { position: relative; padding: 16px 84px 14px 16px; border-bottom: 1px solid var(--line); }
.d-head h3 { margin: 4px 0; font: 600 16px var(--sans); overflow-wrap: anywhere; }
.d-head .num, .d-head .links { font: 12px var(--mono); color: var(--muted); }
.d-head .links { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 6px; }
.close { position: absolute; top: 14px; right: 14px; font: 12px var(--mono); border: 1px solid var(--line-2); padding: 4px 8px; }
.close:hover { border-color: var(--text); }
.d-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
.d-files { border-right: 1px solid var(--line); overflow: auto; padding: 10px 8px 20px; }
.d-group { font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 8px 4px; }
.d-group:first-child { margin-top: 0; }
.d-file { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 5px 8px; border-radius: 3px; font: 12px var(--mono); color: var(--muted); }
.d-file:hover, .d-file.on { background: var(--panel-2); color: var(--text); }
.d-file.on { box-shadow: inset 2px 0 var(--accent); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex: none; display: block; }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warn); }
.dot.stop { background: var(--bad); }
pre.file { margin: 0; padding: 16px; font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; }
footer { max-width: 1280px; margin: 0 auto; padding: 0 28px 30px; color: var(--muted); font: 11px var(--mono); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .top { flex-wrap: wrap; gap: 12px 18px; padding: 12px 16px; }
  .tools { margin-left: 0; width: 100%; }
  .search { flex: 1; }
  .page { padding: 16px 14px 28px; }
  .d-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .d-files { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; max-height: 132px; }
  .d-group { display: none; }
  .d-file { width: auto; white-space: nowrap; }
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@media (prefers-reduced-motion: no-preference) {
  .filters button { transition: background .12s, color .12s; }
  .pulse, .kchip.wait { animation: pulse 1.6s ease-in-out infinite; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#top">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4a26" stroke-width="2" aria-hidden="true"><path d="M3 21V10l6 4V10l6 4V4h6v17z"/></svg>
    factory fleet
  </a>
  <div id="filters" class="filters" role="group" aria-label="Projects"></div>
  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">Search jobs</span>
      <input id="search" type="search" placeholder="Search jobs..." autocomplete="off" spellcheck="false">
      <kbd id="hotkey">Ctrl K</kbd>
    </label>
    <div class="live" id="live" role="status"><span>connecting</span></div>
  </div>
</header>
<main class="page" id="view"></main>
<footer><span id="foot-left">read-only · one job still belongs to one project</span><span id="foot-right"></span></footer>
<script>
"use strict";
// Job text is untrusted. Nodes are created one by one and text goes in as text.
const RUNNING = new Set(["agent", "checks", "review", "merge", "verify"]);
const FOOT_NOTE = "read-only · one job still belongs to one project";
const FILE_ORDER = ["issue.md", "intake.md", "spec.md", "build.md", "decision.md", "verify.md", "rejection.md"];
const REVIEW_ORDER = ["code", "security", "ux", "ui"];
const FALLBACK = [
  ["intake", ["intake", "ask-author"]],
  ["spec", ["spec"]],
  ["build", ["build", "gate", "debug"]],
  ["review", ["review"]],
  ["approve", ["approve", "merge", "verify"]],
  ["needs-you", ["spec-approval", "escalated"]],
  ["done", ["done", "rejected", "failed"]],
];
const state = {
  projects: [], queueRows: [], queueErrors: [], projectsDown: false, queueStale: false,
  selected: "all", query: "", drawer: null,
};

function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : String(value));
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
  return node;
}
function link(url, text) {
  return /^https:\/\//.test(url || "") ? el("a", { class: "ext", href: url, target: "_blank", rel: "noopener noreferrer", text }) : el("span", { class: "num", text });
}
const time = (stamp) => (stamp ? new Date(stamp).getTime() : null);
function span(seconds) {
  if (seconds === null || seconds === undefined || isNaN(seconds)) return "-";
  if (seconds < 60) return Math.round(seconds) + "s";
  if (seconds < 3600) return Math.round(seconds / 60) + "m";
  if (seconds < 172800) return (seconds / 3600).toFixed(1).replace(/\.0$/, "") + "h";
  return Math.round(seconds / 86400) + "d";
}
const money = (n) => "$" + Number(n).toFixed(2);
function matches(job) {
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  return [job.id, job.title, "#" + job.issue, job.step, job.author, job.pr ? "#" + job.pr : ""].some((value) => String(value || "").toLowerCase().includes(q));
}
function queueMatches(row) {
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  return [row.note, "#" + row.issue, row.action, row.job, row.step].some((value) => String(value || "").toLowerCase().includes(q));
}
function queueCards(rows, jobs) {
  const ids = new Set(jobs.map((job) => job.id));
  const issues = new Set(jobs.map((job) => String(job.issue)));
  const seen = new Set();
  const out = [];
  for (const row of rows) {
    if (row.action !== "new" && row.action !== "hold") continue;
    if (row.job && row.job !== "-" && ids.has(row.job)) continue;
    if (issues.has(String(row.issue))) continue;
    const key = String(row.issue);
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(row);
  }
  return out;
}
function order(graph) {
  const steps = new Map(graph.steps.map((s) => [s.name, s]));
  const spine = [];
  let name = graph.start;
  while (name && steps.has(name) && !spine.includes(name)) {
    spine.push(name);
    const step = steps.get(name);
    const next = step.enabled === false ? step.edges.find((e) => e.outcome === step.skip) : step.edges.find((e) => !spine.includes(e.to));
    name = next ? next.to : null;
  }
  const out = spine.slice();
  let moved = true;
  while (moved) {
    moved = false;
    for (const step of graph.steps) {
      if (out.includes(step.name) || step.name === graph.escalate_to) continue;
      const from = out.filter((n) => steps.get(n).edges.some((e) => e.to === step.name));
      if (!from.length) continue;
      let at = Math.max(...from.map((n) => out.indexOf(n))) + 1;
      while (at < out.length && !spine.includes(out[at])) at++;
      out.splice(at, 0, step.name);
      moved = true;
    }
  }
  for (const step of graph.steps) if (!out.includes(step.name)) out.push(step.name);
  const ends = graph.end_states.slice().sort((x, y) => (x === "done" ? -1 : y === "done" ? 1 : x < y ? -1 : 1));
  return out.concat(ends);
}
function columnsFor(graph, allJobs) {
  const steps = new Map((graph.steps || []).map((s) => [s.name, s]));
  const ends = new Set(graph.end_states || []);
  const present = new Set(allJobs.map((j) => j.step).filter((name) => name));
  const cols = [];
  const columnOf = (name) => cols.find((col) => col.steps.includes(name));
  const workColumn = () => {
    for (let i = cols.length - 1; i >= 0; i--) if (cols[i].id !== "needs-you") return cols[i];
    return null;
  };
  for (const name of order(graph)) {
    if (ends.has(name)) continue;
    const step = steps.get(name);
    if (!step) continue;
    if (step.enabled === false && !present.has(name)) continue;
    if (step.type === "human") {
      if (step.who === "author") {
        const target = (step.edges || []).map((edge) => edge.to).find((to) => columnOf(to));
        if (target) { columnOf(target).steps.push(name); continue; }
      }
      let needs = cols.find((col) => col.id === "needs-you");
      if (!needs) {
        needs = { id: "needs-you", label: "Needs you", cls: "human", steps: [] };
        cols.push(needs);
      }
      needs.steps.push(name);
      continue;
    }
    if ((step.type === "checks" || step.type === "merge" || step.type === "verify") && workColumn()) {
      workColumn().steps.push(name);
      continue;
    }
    cols.push({ id: name, label: name, cls: "", steps: [name] });
  }
  const needs = cols.find((col) => col.id === "needs-you");
  const ordered = cols.filter((col) => col.id !== "needs-you");
  if (needs) ordered.push(needs);
  const covered = new Set(ordered.flatMap((col) => col.steps).concat(graph.end_states || []));
  const stray = [...present].filter((name) => !covered.has(name));
  if (stray.length) ordered.push({ id: "other", label: "Other", cls: "", steps: stray });
  if ((graph.end_states || []).length) ordered.push({ id: "done", label: "Done", cls: "done", steps: graph.end_states.slice() });
  return ordered;
}
function fallbackColumns(jobs) {
  const present = new Set(jobs.map((job) => job.step).filter((name) => name));
  const known = new Set(FALLBACK.flatMap((row) => row[1]));
  const cols = [];
  FALLBACK.forEach((row) => {
    const mine = row[1].filter((name) => present.has(name));
    if (!mine.length) return;
    const id = row[0];
    cols.push({
      id,
      label: id === "needs-you" ? "Needs you" : id === "done" ? "Done" : id,
      cls: id === "needs-you" ? "human" : id === "done" ? "done" : "",
      steps: mine,
    });
  });
  const stray = [...present].filter((name) => !known.has(name));
  if (stray.length) {
    const other = { id: "other", label: "Other", cls: "", steps: stray };
    const doneAt = cols.findIndex((col) => col.id === "done");
    if (doneAt >= 0) cols.splice(doneAt, 0, other);
    else cols.push(other);
  }
  return cols;
}
function columnsOf(project) {
  const jobs = project.jobs || [];
  const graph = project.graph;
  if (graph && Array.isArray(graph.steps) && Array.isArray(graph.end_states)) {
    try { return columnsFor(graph, jobs); } catch (error) { /* a broken graph still shows the jobs */ }
  }
  return fallbackColumns(jobs);
}
function columnWho(col) {
  if (col.id === "queue") return "not a job yet";
  if (col.id === "needs-you" || col.id === "other" || col.id === "done") return col.steps.join(" · ");
  return col.steps.slice(1).join(" · ");
}
function stepOf(graph, name) {
  if (!graph || !Array.isArray(graph.steps)) return null;
  return graph.steps.find((step) => step.name === name) || null;
}
function isEnd(graph, name) {
  const ends = graph && Array.isArray(graph.end_states) ? graph.end_states : ["done", "rejected", "failed"];
  return ends.includes(name);
}
function liveJob(job, graph) {
  const step = stepOf(graph, job.step);
  return !!(step && RUNNING.has(step.type) && !job.waiting);
}
function jobNum(id) {
  const text = String(id || "");
  const cut = text.indexOf("-");
  return cut > 0 ? text.slice(0, cut) + " · " + text.slice(cut + 1) : text;
}
function elapsed(job) {
  const start = time(job.created_at);
  if (!start) return "-";
  return span(((time(job.finished_at) || Date.now()) - start) / 1000);
}
function flagOf(job) {
  if (job.waiting && job.waiting.who === "author") return "asked author";
  if (job.waiting && job.waiting.who === "maintainer") return "your call";
  if (job.step === "rejected") return "rejected";
  return "";
}
function riskClass(risk) {
  const name = String(risk || "").toLowerCase();
  if (name === "high") return "hot";
  if (name === "medium") return "warn";
  return "";
}
function chipVerdict(line, prefix) {
  const match = String(line || "").match(new RegExp("^" + prefix + ":\\s*(PASS|FAIL|CHANGES)\\b"));
  if (match) return match[1];
  return line ? "bad" : "pending";
}
function shortReview(name) {
  if (name === "security") return "sec";
  return name.length > 6 ? name.slice(0, 4) : name;
}
function roundRows(job) {
  const files = job.files || [];
  let max = job.round || 0;
  files.forEach((file) => {
    const match = String(file.path).match(/^round-(\d+)\//);
    if (match) max = Math.max(max, Number(match[1]));
  });
  const rows = [];
  for (let n = 1; n <= max; n++) {
    const checks = files.find((file) => file.path === "round-" + n + "/checks.md");
    const gate = checks ? chipVerdict(checks.first_line, "GATE") : "pending";
    const reviews = files.filter((file) => new RegExp("^round-" + n + "/review-[^/]+\\.md$").test(file.path)).map((file) => ({
      name: file.path.split("/").pop().replace(/^review-|\.md$/g, ""),
      v: chipVerdict(file.first_line, "VERDICT"),
    })).sort((a, b) => (a.name < b.name ? -1 : 1));
    rows.push({ n, gate, reviews: gate === "PASS" ? reviews : [] });
  }
  return rows;
}
function kchip(label, verdict, waiting, gate) {
  const known = verdict === "PASS" || verdict === "FAIL" || verdict === "CHANGES";
  const cls = "kchip" + (gate ? " gate" : "") + (known ? " " + verdict : verdict === "bad" ? " bad" : waiting ? " wait" : "");
  return el("span", { class: cls, title: label + " " + verdict, text: label });
}
function roundLine(job, row) {
  const current = row.n === job.round;
  const chips = [kchip("gate", row.gate, current && job.step === "gate", true)];
  if (row.gate === "PASS") row.reviews.forEach((review) => chips.push(kchip(shortReview(review.name), review.v, current && job.step === "review", false)));
  return el("div", { class: "round" }, el("span", { class: "r", text: "R" + row.n }), chips);
}
function commands(job, graph) {
  const step = stepOf(graph, job.step);
  if (!step || !job.waiting) return [];
  const hint = { REJECT: " <why>", ANSWER: " <your answer>", APPROVE: "" };
  return (step.edges || []).map((edge) => "/factory " + String(edge.outcome || "").toLowerCase() + " " + job.issue + (edge.outcome in hint ? hint[edge.outcome] : " <what to change>"));
}
function cardHint(job, graph) {
  if (!job.waiting) return "";
  if (job.reason) return String(job.reason).split("\n")[0].slice(0, 180);
  const lines = commands(job, graph);
  return lines.length ? lines[0] : "";
}
function cardClass(job, project, graph) {
  const parts = ["kcard"];
  if (state.drawer && state.drawer.project === project.id && state.drawer.id === job.id) parts.push("on");
  if (job.step === "rejected") parts.push("rejected");
  const step = stepOf(graph, job.step);
  if (isEnd(graph, job.step)) parts.push("done");
  else if (job.waiting) parts.push("human");
  else if (step && RUNNING.has(step.type)) parts.push("live");
  return parts.join(" ");
}
function jobCard(job, project) {
  const graph = project.graph;
  const flag = flagOf(job);
  const hint = cardHint(job, graph);
  const cls = cardClass(job, project, graph);
  return el("article", {
    class: cls, tabindex: 0, role: "button", "aria-label": (job.title || job.id) + ", " + project.name,
    onclick: (event) => { if (event.target.closest("a")) return; openDrawer(project, job); },
    onkeydown: (event) => {
      if (event.target.closest("a")) return;
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openDrawer(project, job); }
    },
  },
    el("div", { class: "card-top" },
      cls.includes("live") ? el("span", { class: "pulse", "aria-hidden": "true" }) : null,
      el("span", { class: "num", text: jobNum(job.id) }),
      flag ? el("span", { class: "flag", text: flag }) : null),
    el("p", { class: "feature", text: job.title || job.id }),
    el("div", { class: "links" },
      link(job.issue_url, "issue #" + (job.issue == null ? "" : job.issue)),
      job.pr ? link(job.pr_url, "PR #" + job.pr) : null),
    roundRows(job).map((row) => roundLine(job, row)),
    el("div", { class: "meta" },
      job.intake && job.intake.risk ? el("span", { class: riskClass(job.intake.risk), text: job.intake.risk }) : null,
      el("span", { text: job.cost_usd !== null && job.cost_usd !== undefined ? money(job.cost_usd) : "—" }),
      el("span", { text: elapsed(job) })),
    hint ? el("p", { class: "hint", text: hint }) : null);
}
function queueCard(row) {
  return el("article", { class: "kcard" },
    el("div", { class: "card-top" },
      el("span", { class: "num", text: row.action || "new" }),
      el("span", { class: "flag", text: "#" + (row.issue || "") })),
    el("p", { class: "feature", text: row.note || ("issue #" + (row.issue || "")) }));
}
function fileRank(path) {
  const exact = FILE_ORDER.indexOf(path);
  if (exact >= 0) return [0, exact, 0, path];
  const feedback = String(path).match(/^feedback-(\d+)\.md$/);
  if (feedback) return [1, Number(feedback[1]), 0, path];
  const round = String(path).match(/^round-(\d+)\/(.+)\.(md|log)$/);
  if (round) {
    const stem = round[2];
    let kind = 50;
    if (stem === "checks") kind = round[3] === "log" ? 1 : 0;
    else if (stem.startsWith("review-")) {
      const at = REVIEW_ORDER.indexOf(stem.slice(7));
      kind = 10 + (at >= 0 ? at : 9);
    } else if (stem.startsWith("debug")) kind = 20;
    return [2, Number(round[1]), kind, path];
  }
  return [3, 0, 0, path];
}
function sortedFiles(files) {
  return files.slice().sort((a, b) => {
    const left = fileRank(a.path), right = fileRank(b.path);
    return left[0] - right[0] || left[1] - right[1] || left[2] - right[2] || (left[3] < right[3] ? -1 : left[3] > right[3] ? 1 : 0);
  });
}
function fileGroup(path) {
  if (String(path).startsWith("round-")) return path.split("/")[0].replace("round-", "Round ");
  if (String(path).startsWith("feedback-")) return "Feedback";
  return "Job";
}
function fileLabel(path) {
  const round = String(path).match(/^round-(\d+)\/(.+)$/);
  if (!round) return path;
  const stem = round[2].replace(/\.md$/, "").replace(/\.log$/, "");
  if (stem === "checks" && String(path).endsWith(".log")) return "R" + round[1] + " checks.log";
  if (stem === "checks") return "R" + round[1] + " checks";
  if (stem.startsWith("review-")) return "R" + round[1] + " " + stem.slice(7);
  return "R" + round[1] + " " + stem;
}
function tone(first) {
  const line = String(first || "");
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT|STATUS:\s*ok)/.test(line)) return "good";
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)/.test(line)) return "warn";
  if (/^(ESCALATE|REJECTED|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT|VERDICT:\s*FAIL)/.test(line)) return "stop";
  return "";
}
function closeDrawer() {
  state.drawer = null;
  render();
}
function openDrawer(project, job) {
  if (state.drawer && state.drawer.project === project.id && state.drawer.id === job.id) return;
  const files = sortedFiles(job.files || []);
  const path = files.length ? files[0].path : null;
  state.drawer = { project: project.id, id: job.id, path, text: path ? "Loading..." : "No files yet.", focus: true };
  render();
  if (path) fetchDrawer(project.id, job, path);
}
function pickFile(projectId, job, path) {
  if (!state.drawer || state.drawer.project !== projectId || state.drawer.id !== job.id) return;
  state.drawer.path = path;
  state.drawer.text = "Loading...";
  state.drawer.focus = false;
  render();
  fetchDrawer(projectId, job, path);
}
async function fetchDrawer(projectId, job, path) {
  const url = "/projects/" + encodeURIComponent(projectId) + "/jobs/" + [job.id].concat(String(path).split("/")).map(encodeURIComponent).join("/");
  let text;
  try {
    const res = await fetch(url, { cache: "no-store" });
    text = res.ok ? await res.text() : "Could not load " + path + " (" + res.status + ").";
  } catch (error) {
    text = "Could not load " + path + ".";
  }
  if (!state.drawer || state.drawer.project !== projectId || state.drawer.id !== job.id || state.drawer.path !== path) return;
  state.drawer.text = text;
  render();
}
function fileList(projectId, job, files) {
  const box = el("div", { class: "d-files" });
  let group = "";
  files.forEach((file) => {
    const name = fileGroup(file.path);
    if (name !== group) {
      group = name;
      box.append(el("div", { class: "d-group", text: name }));
    }
    const mark = tone(file.first_line);
    box.append(el("button", {
      type: "button", class: "d-file" + (state.drawer.path === file.path ? " on" : ""),
      "aria-pressed": String(state.drawer.path === file.path),
      onclick: () => pickFile(projectId, job, file.path),
    }, el("i", { class: "dot" + (mark ? " " + mark : "") }), el("span", { text: fileLabel(file.path) })));
  });
  if (!files.length) box.append(el("p", { class: "kempty", text: "No files yet." }));
  return box;
}
function findJob(projectId, jobId) {
  const project = state.projects.find((item) => item.id === projectId);
  if (!project) return null;
  const job = (project.jobs || []).find((item) => item.id === jobId);
  return job ? { project, job } : null;
}
function drawer() {
  if (!state.drawer) return null;
  const close = el("button", { type: "button", class: "close", "data-close": "true", text: "close", onclick: closeDrawer });
  const found = findJob(state.drawer.project, state.drawer.id);
  if (!found) {
    return el("div", { class: "overlay" }, el("div", { class: "scrim", onclick: closeDrawer }),
      el("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-label": "Job" },
        el("div", { class: "d-head" }, el("h3", { text: "That job is gone." }), close)));
  }
  const job = found.job;
  const files = sortedFiles(job.files || []);
  return el("div", { class: "overlay" },
    el("div", { class: "scrim", onclick: closeDrawer }),
    el("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-labelledby": "d-title" },
      el("div", { class: "d-head" },
        el("div", { class: "num", text: found.project.name + " · " + job.id + " · " + (job.step || "") + (job.round ? " · round " + job.round : "") }),
        el("h3", { id: "d-title", text: job.title || job.id }),
        el("div", { class: "links" },
          link(job.issue_url, "issue #" + (job.issue == null ? "" : job.issue)),
          job.pr ? link(job.pr_url, "PR #" + job.pr) : null),
        close),
      el("div", { class: "d-body" }, fileList(found.project.id, job, files), el("pre", { class: "file d-doc", tabindex: 0, text: state.drawer.text || "" }))));
}
function column(col, shown, project) {
  const queued = col.queue ? col.queue.filter(queueMatches) : null;
  const mine = queued || shown.filter((job) => col.steps.includes(job.step));
  const who = columnWho(col);
  return el("section", { class: "kcol" + (col.cls ? " " + col.cls : ""), "aria-label": col.label },
    el("div", { class: "kcol-head" },
      el("h3", { text: col.label }),
      who ? el("span", { class: "who", text: who }) : null,
      el("span", { class: "count", text: String(mine.length) })),
    mine.length ? mine.map((item) => col.queue ? queueCard(item) : jobCard(item, project)) : el("p", { class: "kempty", text: "—" }));
}
function projectColumns(project) {
  const cols = columnsOf(project);
  const mine = state.queueRows.filter((row) => row.project === project.id);
  const queued = queueCards(mine, project.jobs || []);
  if (queued.length) cols.unshift({ id: "queue", label: "Queue", cls: "", steps: [], queue: queued });
  return cols;
}
function projectSection(project) {
  const jobs = project.jobs || [];
  const shown = jobs.filter(matches);
  const errors = state.queueErrors.filter((item) => String(item).indexOf(project.id + ": ") === 0);
  const running = jobs.filter((job) => liveJob(job, project.graph)).length;
  const cost = jobs.reduce((sum, job) => sum + (Number(job.cost_usd) || 0), 0);
  const cols = projectColumns(project);
  const bits = [
    el("h2", { text: project.name || project.id }),
    project.path ? el("p", { class: "path", text: project.path }) : null,
    project.description ? el("p", { class: "sub", text: project.description }) : null,
    project.error ? el("p", { class: "error", text: String(project.error) }) : null,
    errors.map((item) => el("p", { class: "error", text: String(item) })),
    el("p", { class: "sub", text: running + " running · " + money(cost) + " · " + shown.length + " of " + jobs.length }),
    cols.length ? el("div", { class: "kanban" }, cols.map((col) => column(col, shown, project))) : el("p", { class: "kempty", text: "no jobs" }),
  ];
  return el("section", { class: "project" }, bits);
}
function visibleProjects() {
  return state.projects.filter((project) => state.selected === "all" || state.selected === project.id);
}
function filterButton(id, text) {
  return el("button", {
    type: "button", text: text, "aria-pressed": state.selected === id ? "true" : "false",
    onclick: () => { state.selected = id; render(); },
  });
}
function renderFilters() {
  const buttons = [filterButton("all", "all")];
  state.projects.forEach((project) => buttons.push(filterButton(project.id, project.name || project.id)));
  document.getElementById("filters").replaceChildren(...buttons);
}
function markLive() {
  const live = document.getElementById("live");
  live.className = "live" + (state.projectsDown || state.queueStale ? " stale" : "");
  const label = state.projectsDown ? "offline" : state.queueStale ? "queue stale" : "live";
  live.replaceChildren(el("span", { text: label }));
}
function render() {
  if (state.selected !== "all" && !state.projects.some((project) => project.id === state.selected)) state.selected = "all";
  renderFilters();
  markLive();
  const projects = visibleProjects();
  let running = 0;
  let cost = 0;
  projects.forEach((project) => {
    (project.jobs || []).forEach((job) => {
      if (liveJob(job, project.graph)) running += 1;
      cost += Number(job.cost_usd) || 0;
    });
  });
  document.getElementById("foot-left").textContent = running + " running · " + money(cost) + " · " + FOOT_NOTE;
  const target = document.getElementById("view");
  const scrollers = "pre.file, .d-doc, .d-files";
  const scroll = [...target.querySelectorAll(scrollers)].map((n) => n.scrollTop);
  const nodes = projects.map((project) => projectSection(project));
  if (!nodes.length) nodes.push(el("p", { class: "kempty", text: state.projectsDown ? "could not load projects" : "no projects yet" }));
  const panel = drawer();
  if (panel) nodes.push(panel);
  target.replaceChildren(...nodes);
  [...target.querySelectorAll(scrollers)].forEach((n, i) => { if (scroll[i]) n.scrollTop = scroll[i]; });
  if (state.drawer && state.drawer.focus) {
    const close = target.querySelector("[data-close]");
    if (close) close.focus();
    state.drawer.focus = false;
  }
}
async function tick() {
  try {
    const response = await fetch("/projects.json", { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    const body = await response.json();
    const next = body.projects || [];
    const changed = JSON.stringify(next) !== JSON.stringify(state.projects);
    state.projects = next;
    state.projectsDown = false;
    if (changed) {
      render();
      if (state.drawer && state.drawer.path) {
        const found = findJob(state.drawer.project, state.drawer.id);
        if (found) fetchDrawer(found.project.id, found.job, state.drawer.path);
      }
    } else markLive();
  } catch (error) {
    state.projectsDown = true;
    render();
  }
}
async function tickQueue() {
  try {
    const response = await fetch("/queue.json", { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    const body = await response.json();
    const rows = body.rows || [];
    const errors = body.errors || [];
    const changed = JSON.stringify([rows, errors]) !== JSON.stringify([state.queueRows, state.queueErrors]);
    state.queueRows = rows;
    state.queueErrors = errors;
    state.queueStale = false;
    if (changed) render(); else markLive();
  } catch (error) {
    state.queueStale = true;
    render();
  }
}
function boot() {
  const search = document.getElementById("search");
  if (/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById("hotkey").textContent = "⌘ K";
  search.addEventListener("input", () => { state.query = search.value; render(); });
  document.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); search.focus(); search.select(); }
    else if (event.key === "Escape" && document.activeElement === search) { search.value = ""; state.query = ""; search.blur(); render(); }
    else if (event.key === "Escape" && state.drawer) closeDrawer();
  });
  render();
  tick();
  tickQueue();
  setInterval(tick, 2000);
  setInterval(tickQueue, 15000);
}
/* boot */
boot();
</script>
