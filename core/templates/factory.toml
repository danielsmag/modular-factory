# The software factory's configuration. With the pipelines in pipelines/*.yaml,
# this is all you edit.
#
# It holds what this project changes. Everything else comes from
# .factory/defaults.toml and each tool's adapter in .factory/adapters/.
#
# Reference: https://danielsmag.github.io/modular-factory/docs/configuration.html
#
#   .factory/bin/mfactory config show   every setting and where its value comes from
#   .factory/bin/mfactory graph         the pipeline in effect
#   .factory/bin/mfactory models        the model and effort of each agent
# After a change, run `.factory/bin/mfactory sync` and commit the result.

# Version of this file's format. `mfactory upgrade` refuses a release that needs another.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#project-tools-and-run
schema = 1

[project]
# What the project is for, and what does not belong. Intake judges issues against this.
description = ""
# Jobs branch from origin/<base_branch> and merge into it.
base_branch = "__BASE_BRANCH__"
# Example pull request title. The builder uses this shape instead of the spec title.
# Leave it unset to use the spec title. The script does not fill placeholders.
# With squash merge, the title is the commit on the base branch.
# pr_title = "feat: add CSV export [ABC-123]"
# Regular expression the whole title must match (fullmatch). Unset means no check.
# `done` refuses a READY build whose title does not match.
# pr_title_pattern = '^(feat|fix|perf|refactor|chore|docs|test|ci|build|revert)(\(.+\))?!?: .+ \[[A-Z]+-\d+\]$'
# How the pull request body links the issue. "refs" (the default) keeps the issue
# open after the merge, so steps after the merge still see it; close it with
# `mfactory close issue <job>`. "closes" lets GitHub close it when the pull request merges.
# issue_link = "closes"
# Prefix concatenated with the job id. Include the slash: feature/001-add-dark-mode.
# A revert branch is this prefix plus revert- and the job id.
# branch_prefix = "feature/"
# Regular expression the whole branch name must match (fullmatch). Unset means no check.
# The factory checks the name when it chooses the branch, before creating it.
# The pattern has to match a revert branch too.
# branch_pattern = '^(feature|fix|chore|docs|test|hotfix)/[A-Za-z0-9._-]+$'

[tools]
# Tools to write agent files for: claude, cursor, codex.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#project-tools-and-run
enabled = [__TOOLS__]

[run]
# Jobs this project works on at once. A job waiting for a person, or being
# validated after merge, does not count.
concurrency = 3
# Which labeled issues `queue` offers as new jobs. "mine": the ones you opened
# or are assigned to. `authors` and `assignees` add logins; "@me" is you.
# `/mfactory run <n>` still runs any labeled issue.
# pick = "mine"
# authors = ["alice"]
# assignees = ["@me"]
# The pipeline a new job runs when `/mfactory run` gets no --pipeline. Unset, a
# project with one pipeline runs it, and with several /mfactory run asks which.
# pipeline = "default"

[checks]
# Commands run in order in the job's worktree with `bash -c`. The first non-zero exit fails the step.
# They run at the gate step, and again in merge after the base branch is merged in, when merge is on.
# A command must not rewrite files. Example: ["npm ci", "npm run lint", "npm test"]
# https://danielsmag.github.io/modular-factory/docs/configuration.html#checks
commands = []

# ---- The pipeline ----------------------------------------------------------
#
# The steps a job goes through are not in this file. They are YAML files in
# pipelines/, starting with pipelines/default.yaml, which `mfactory install`
# wrote: who merges, the optional steps (spec approval, debug, verify after the
# merge), loop limits (`max` on an edge), and steps you add all go there.
# .factory/schema/pipeline.schema.json says what a pipeline file may contain.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#pipelines-yaml-files
#
#   .factory/bin/mfactory pipelines list       every pipeline
#   .factory/bin/mfactory pipelines validate   check them

# ---- Models: per tool, per step --------------------------------------------
#
# Set the model and effort for one agent. Other agents stay on the adapter default.
# `low` is a cheaper model used when intake marks the job low-risk.
# Claude efforts: low, medium, high, xhigh, max. Cursor and Codex also take none and minimal.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#models-and-effort

# [models.claude]
# build = { model = "opus", effort = "high" }
# reviewer-code = { model = "sonnet", effort = "medium", low = { model = "haiku", effort = "low" } }

# ---- Skills ----------------------------------------------------------------
#
# Nothing is read unless you list it. `[skills].all` is read by every agent. A step's `skills` is extra.
# A bare name is a project skill under .claude/skills, .cursor/skills, .agents/skills or .codex/skills.
# `user:name` is a skill in your home directory. `plugin:skill` is an installed plugin skill,
# such as superpowers:test-driven-development. `all` takes every skill from those three places.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#project-skills

# [skills]
# all = ["code-style"]
#
# A step's own skills go on the step, in pipelines/default.yaml:
#   build:
#     skills: [testing, "user:python-best-practices", "superpowers:test-driven-development"]

# Claude Code agents may use every tool, plugin and MCP tools included. Narrow one with a list;
# "default" is its built-in list.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#tools
# A step's tools go on the step, in pipelines/default.yaml:
#   build:
#     tools: [default, WebFetch, "mcp__github__*"]

# ---- Instruction files -----------------------------------------------------
#
# AGENTS.md, CLAUDE.md, and rule files. Nothing here is read from `skills`.
# `all` takes every one found in the repo and in your home directory.
# The builder also names AGENTS.md (or CLAUDE.md when AGENTS.md is missing) and
# ~/.claude/CLAUDE.md. A project file you list yourself must exist or sync
# fails; a missing user file is a doctor warning.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#instruction-files

[rules]
all = ["all"]

# A step's own rules go on the step, in pipelines/default.yaml:
#   build:
#     rules: [AGENTS.md, "user:CLAUDE.md"]

# ---- Reviewers and custom steps --------------------------------------------
#
# A reviewer you add needs a focus, a prompt file, or both.
# A custom step needs instructions, an instructions file, or both.
# Both paths are from the repo root. The file must exist, or sync fails.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#reviewers-and-surfaces
# https://danielsmag.github.io/modular-factory/docs/configuration.html#adding-a-step
#
# [reviewers.data]
# prompt = "docs/review-data.md"
#
# [surfaces.pipelines]
# when = "it changes a pipeline, a model, or a warehouse query"
# reviewers = ["data"]
#
# ux and ui ship switched off. A project with a user interface switches
# them on, with their surface:
#
# [reviewers.ux]
# enabled = true
#
# [reviewers.ui]
# enabled = true
#
# [surfaces.ui]
# enabled = true
#
# A custom step goes in pipelines/default.yaml, and an edge points at it:
#   docs:
#     type: agent
#     instructions_file: docs/docs-step.md
#     on: { DONE: gate, SKIP: gate }
#
# Jobs come from GitHub issues with the `factory` label. To take them from a
# Jira kanban board instead, or as well, map each step to a status of the
# board. The account email may be set below, or it comes from JIRA_EMAIL. The
# API token comes from token_file, or from JIRA_API_TOKEN, or from that key in
# .env. Never put the token itself in this file. Without an email and a token
# the factory uses the Atlassian CLI, acli, and then needs `project`. A
# factory.toml shared by a team leaves email and token_file empty.
# `mfactory tracker suggest` prints the board and the columns for your steps.
# With both trackers, the first kind is where `mfactory file` opens new
# issues, and people lists name people per tracker.
# https://danielsmag.github.io/modular-factory/docs/configuration.html#tracker-a-jira-board
#
# [tracker]
# kind = "jira"               # or ["github", "jira"] for both
#
# [tracker.jira]
# site = "https://acme.atlassian.net"
# board = 1234
# email = "you@example.com"     # optional. Empty: JIRA_EMAIL
# token_file = ".secrets/jira"  # optional. One line, the token only. Do not commit that file
#
# [tracker.jira.columns]
# queue = "Ready for factory"
# watch = ["Backlog"]          # shown on the dashboard only, never built
# intake = "Intake"
# ask-author = "Needs info"
# spec = "Spec"
# build = "Build"
# gate = "Build"
# review = "Review"
# approve = "Review"
# ready-to-merge = "Ready to merge"
# escalated = "Escalated"
# done = "Done"
# rejected = "Rejected"
