<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>factory</title>
<style>
:root {
  --bg: #0b0b0b;
  --panel: #151515;
  --panel-2: #1b1b1b;
  --line: #2a2a2a;
  --line-2: #3a3a3a;
  --text: #f2f2f2;
  --muted: #9a9a9a;
  --accent: #ff4a26;
  --accent-fill: #d93a1b;
  --accent-deep: #a82812;
  --good: #2fbf71;
  --bad: #ff5a4f;
  --warn: #e0a83a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font: 14px/1.45 var(--sans); border-top: 3px solid var(--accent);
  background-image: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(255, 255, 255, .018) 3px 4px);
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- top bar ---- */
.top {
  display: flex; align-items: center; gap: 28px; padding: 14px 28px; max-width: 1280px; margin: 0 auto;
  font-family: var(--mono); position: relative; z-index: 2;
}
.brand { display: flex; align-items: center; gap: 10px; font: 600 19px var(--sans); letter-spacing: -.01em; text-decoration: none; }
.brand svg { width: 22px; height: 22px; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav a { padding: 3px 5px; text-decoration: none; font-size: 13px; white-space: nowrap; }
.nav a::before { content: "["; }
.nav a::after { content: "]"; }
.nav a:hover { color: var(--accent); }
.nav a[aria-current="page"] { background: var(--text); color: var(--bg); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); padding: 6px 10px; min-width: 210px; background: var(--bg); }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: 13px var(--mono); }
.search input::placeholder { color: var(--muted); }
kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-2); padding: 0 5px; border-radius: 2px; white-space: nowrap; }
.cta { background: var(--text); color: var(--bg); font: 600 12px var(--mono); letter-spacing: .06em; padding: 9px 14px; text-decoration: none; white-space: nowrap; }
.cta:hover { background: var(--accent); color: #000; }

/* ---- stage ---- */
.stage { position: relative; max-width: 1280px; margin: 0 auto; padding: 38px 28px 60px; }
.wordmark { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: min(880px, 90%); pointer-events: none; }
.window { position: relative; z-index: 1; margin-top: 112px; background: #0e0e0e; border: 1px solid var(--line-2); box-shadow: 0 30px 80px rgba(0, 0, 0, .7); }
.titlebar { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 7px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: #ff5f57; }
.dots i:nth-child(2) { background: #febc2e; }
.dots i:nth-child(3) { background: #28c840; }
.address { flex: 1; max-width: 420px; margin: 0 auto; background: var(--panel-2); color: var(--muted); font: 11px var(--mono); text-align: center; padding: 4px 10px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live { font: 11px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.live.stale::before { background: var(--bad); }
.body { display: flex; min-height: 560px; }
.rail { flex: none; width: 54px; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; }
.rail a { width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); border-radius: 6px; }
.rail a:hover { color: var(--text); }
.rail a[aria-current="page"] { background: var(--text); color: var(--bg); }
.rail svg { width: 17px; height: 17px; }
.rail hr { width: 24px; border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.view { flex: 1; min-width: 0; padding: 22px 24px 26px; }
h1 { font: 500 22px var(--sans); margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 12px; margin: 3px 0 18px; }
h2 { font: 500 14px var(--sans); margin: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; min-width: 0; }
.panel > .sub { margin-bottom: 12px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

/* ---- cards ---- */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; min-height: 104px; display: flex; flex-direction: column; }
.card.accent { background: linear-gradient(135deg, var(--accent-fill), var(--accent-deep)); border-color: transparent; }
.card .row { display: flex; justify-content: space-between; align-items: flex-start; }
.card .icon { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 4px; color: var(--muted); }
.card.accent .icon { border-color: rgba(255, 255, 255, .5); color: #fff; }
.card .icon svg { width: 14px; height: 14px; }
.delta { font: 11px var(--mono); padding: 1px 6px; border-radius: 3px; background: rgba(47, 191, 113, .14); color: var(--good); }
.delta.flat { background: rgba(255, 255, 255, .07); color: var(--muted); }
.delta.hot { background: rgba(255, 90, 79, .14); color: var(--bad); }
.card.accent .delta { background: rgba(0, 0, 0, .28); color: #fff; }
.card .label { margin-top: auto; font-size: 12px; color: var(--muted); }
.card.accent .label { color: #fff; }
.card .value { font: 500 24px var(--sans); letter-spacing: -.01em; }

/* ---- charts ---- */
.split { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
.tabs { display: flex; gap: 2px; }
.tabs button { font: 11px var(--mono); color: var(--muted); padding: 3px 7px; border-radius: 3px; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-pressed="true"] { background: var(--line-2); color: var(--text); }
.chart { width: 100%; height: auto; display: block; }
.chart text { font: 10px var(--mono); fill: var(--muted); }
.figures { display: flex; gap: 34px; margin-top: 12px; flex-wrap: wrap; }
.figures div { font-size: 11px; color: var(--muted); }
.figures b { display: block; font: 500 15px var(--sans); color: var(--text); }
.figures b.good { color: var(--good); }
.bars { display: grid; gap: 14px; }
.bar .row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
.bar .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .num { font-family: var(--mono); white-space: nowrap; }
.bar .track { height: 3px; background: var(--line); margin-top: 7px; border-radius: 2px; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 2px; }
.bar .pct { text-align: right; font: 10px var(--mono); color: var(--muted); margin-top: 3px; }
.empty { color: var(--muted); font-size: 13px; padding: 26px 0; text-align: center; }

/* ---- tables ---- */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover td { background: var(--panel-2); }
td.mono, .mono { font-family: var(--mono); font-size: 12px; }
td.dim, .dim { color: var(--muted); }
td.wrap { overflow-wrap: anywhere; }
.chip { display: inline-block; font: 11px var(--mono); padding: 1px 7px; border: 1px solid var(--line-2); border-radius: 3px; white-space: nowrap; }
.chip.wait { border-color: var(--accent); color: var(--accent); }
.chip.done { border-color: rgba(47, 191, 113, .5); color: var(--good); }
.chip.bad { border-color: rgba(255, 90, 79, .5); color: var(--bad); }
.chip.run { border-color: var(--text); }
.chip.off { color: var(--muted); border-style: dashed; }
.ext { font-family: var(--mono); font-size: 12px; text-decoration: none; border-bottom: 1px dotted var(--line-2); }
.ext:hover { color: var(--accent); border-color: var(--accent); }

/* ---- pipeline ---- */
.pipe { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.graph { max-width: 100%; min-width: 400px; height: auto; display: block; margin: 0 auto; }
.graph .node > rect { fill: var(--panel-2); stroke: var(--line-2); }
.graph .node text { font: 12px var(--mono); fill: var(--text); }
.graph .node .kind { font-size: 10px; fill: var(--muted); }
.graph .node.off > rect { stroke-dasharray: 4 3; fill: var(--panel); }
.graph .node.off text { fill: #777; }
.graph .node.wait > rect { stroke: var(--accent); }
.graph .node.wait .name { fill: var(--accent); }
.graph .node.end > rect { fill: none; }
.graph .count rect { fill: var(--text); stroke: none; }
.graph .count text { fill: var(--bg); font-weight: 700; font-size: 11px; }
.graph .node.wait .count rect { fill: var(--accent); }
.graph .edge { fill: none; stroke: #6a6a6a; stroke-width: 1; }
.graph .edge.back { stroke: #8d5a4b; }
.graph .edge.off { stroke: #333; }
.graph .port { fill: #8a8a8a; }
.graph .port.back { fill: #c9836f; }
.graph .port.off { fill: #3a3a3a; }
.graph .elabel { font: 10px var(--mono); fill: #a8a8a8; }
.graph .elabel.back { fill: #c9836f; }
.graph .elabel.off { fill: #555; }
.graph.focus .edge, .graph.focus .elabel, .graph.focus .port { opacity: .25; }
.graph.focus .hot { opacity: 1; }
.graph.focus .edge.hot { stroke-width: 1.6; stroke: var(--text); }
.graph.focus .edge.back.hot { stroke: var(--accent); }
.legend { display: flex; gap: 8px 18px; flex-wrap: wrap; font: 11px var(--mono); color: var(--muted); margin-top: 12px; }
.legend i { display: inline-block; width: 22px; border-top: 1px solid #8a8a8a; vertical-align: middle; margin-right: 6px; }
.legend i.back { border-top: 1px solid #c9836f; }
.legend i.box { width: 10px; height: 10px; border: 1px solid var(--accent); }
.legend i.box.off { border: 1px dashed #777; }

/* ---- job ---- */
.jobview { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 12px; }
.joblist { max-height: 760px; overflow: auto; padding: 6px; }
.joblist a { display: block; padding: 8px 10px; text-decoration: none; border-radius: 3px; border-left: 2px solid transparent; }
.joblist a:hover { background: var(--panel-2); }
.joblist a[aria-current="true"] { background: var(--panel-2); border-left-color: var(--accent); }
.joblist .id { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.joblist .meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; margin-top: 2px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.facts { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.facts b { color: var(--text); font-weight: 500; }
.ask { border: 1px solid var(--accent); border-radius: 4px; padding: 14px 16px; background: rgba(255, 74, 38, .06); }
.ask h2 { color: var(--accent); }
.ask p { margin: 6px 0 10px; font-size: 13px; overflow-wrap: anywhere; }
.cmd { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.cmd code { flex: 1; min-width: 0; font: 12px var(--mono); background: var(--bg); border: 1px solid var(--line-2); padding: 6px 9px; overflow-x: auto; white-space: nowrap; }
.cmd button { font: 11px var(--mono); border: 1px solid var(--line-2); padding: 5px 9px; white-space: nowrap; }
.cmd button:hover { border-color: var(--text); }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 16px minmax(90px, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.steps li:last-child { border-bottom: 0; }
.steps .mark { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); align-self: center; }
.steps .now .mark { background: var(--accent); box-shadow: 0 0 0 3px rgba(255, 74, 38, .2); }
.steps .ok .mark { background: var(--good); }
.steps .ko .mark { background: var(--bad); }
.steps .what { overflow-wrap: anywhere; }
.steps .when { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.files { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 12px; }
.filelist button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 3px; font: 12px var(--mono); }
.filelist button:hover { background: var(--panel-2); }
.filelist button[aria-pressed="true"] { background: var(--panel-2); box-shadow: inset 2px 0 var(--accent); }
.filelist .verdict { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
pre.file { margin: 0; background: var(--bg); border: 1px solid var(--line); padding: 12px; font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 520px; overflow: auto; min-height: 120px; }

/* ---- config ---- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.filters button { font: 11px var(--mono); border: 1px solid var(--line-2); padding: 3px 9px; border-radius: 3px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.src { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.src.mine { color: var(--accent); }

.notice { border: 1px solid var(--line-2); padding: 14px 16px; border-radius: 4px; color: var(--muted); font-size: 13px; }
.notice code { font-family: var(--mono); color: var(--text); }
footer { max-width: 1280px; margin: 0 auto; padding: 0 28px 30px; color: var(--muted); font: 11px var(--mono); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 1180px) {
  .pipe { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .top { flex-wrap: wrap; gap: 12px 18px; padding: 12px 16px; }
  .tools { margin-left: 0; width: 100%; }
  .search { flex: 1; }
  .stage { padding: 20px 12px 40px; }
  .wordmark { display: none; }
  .window { margin-top: 0; }
  .body { flex-direction: column; }
  .rail { flex-direction: row; width: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; justify-content: flex-start; }
  .rail hr { display: none; }
  .view { padding: 16px 14px 20px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .jobview, .files { grid-template-columns: minmax(0, 1fr); }
  .joblist { max-height: 220px; }
  .scroll table { min-width: 620px; }
  .live span { display: none; }
  .steps li { grid-template-columns: 16px minmax(0, 1fr) auto; }
  .steps .what { grid-column: 2 / -1; }
}
@media (max-width: 480px) {
  .cards { grid-template-columns: minmax(0, 1fr); }
  .cta { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .rail a, .nav a, .tabs button { transition: background .12s, color .12s; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/board" aria-label="factory, board">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4a26" stroke-width="2" aria-hidden="true"><path d="M3 21V10l6 4V10l6 4V4h6v17z"/></svg>
    factory
  </a>
  <nav class="nav" aria-label="Views">
    <a href="#/board" data-view="board">Board</a>
    <a href="#/pipeline" data-view="pipeline">Pipeline</a>
    <a href="#/jobs" data-view="jobs">Jobs</a>
    <a href="#/config" data-view="config">Config</a>
  </nav>
  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">Search jobs</span>
      <input id="search" type="search" placeholder="Search jobs..." autocomplete="off" spellcheck="false">
      <kbd id="hotkey">Ctrl K</kbd>
    </label>
    <a class="cta" href="https://github.com/danielsmag/modular-factory#readme" target="_blank" rel="noopener noreferrer">DOCS</a>
  </div>
</header>

<div class="stage">
  <svg class="wordmark" id="wordmark" aria-hidden="true"></svg>
  <main class="window">
    <div class="titlebar">
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="address" id="address">.factory/jobs</div>
      <div class="live" id="live" role="status"><span>connecting</span></div>
    </div>
    <div class="body">
      <nav class="rail" aria-label="Views, as icons">
        <a href="#/board" data-view="board" title="Board" aria-label="Board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></a>
        <a href="#/pipeline" data-view="pipeline" title="Pipeline" aria-label="Pipeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 6h9M6.5 8l4.3 7.7M17.5 8l-4.3 7.7"/></svg></a>
        <a href="#/jobs" data-view="jobs" title="Jobs" aria-label="Jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></a>
        <hr>
        <a href="#/config" data-view="config" title="Config" aria-label="Config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></a>
      </nav>
      <section class="view" id="view" aria-live="off"></section>
    </div>
  </main>
</div>
<footer><span id="foot-left">read-only · approvals and feedback go through /factory or an issue comment</span><span id="foot-right"></span></footer>

<script>
"use strict";
// Everything shown here may come from a GitHub issue, so no markup is ever built
// from strings: nodes are created one by one and text goes in as text.
const SVG = "http://www.w3.org/2000/svg";
const REFRESH_MS = 5000;
const RUNNING = new Set(["agent", "checks", "review", "merge", "verify"]);
const state = { index: null, graph: null, config: null, error: null, query: "", range: "30", file: null, source: "all" };

function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : String(value));
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
  return node;
}
function svg(tag, attrs, ...kids) {
  const node = document.createElementNS(SVG, tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "text") node.textContent = value;
    else if (value !== null && value !== undefined) node.setAttribute(key, String(value));
  }
  for (const kid of kids.flat(Infinity)) if (kid) node.append(kid);
  return node;
}
function icon(path) {
  const node = svg("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2, "aria-hidden": "true" });
  node.append(svg("path", { d: path }));
  return node;
}
function link(url, text) {
  // Only real web addresses become links; anything else is shown as plain text.
  return /^https:\/\//.test(url || "") ? el("a", { class: "ext", href: url, target: "_blank", rel: "noopener noreferrer", text }) : el("span", { class: "mono", text });
}

// ---- data helpers ----
const time = (stamp) => (stamp ? new Date(stamp).getTime() : null);
function ago(stamp) {
  const t = time(stamp);
  if (!t) return "-";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 129600) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
