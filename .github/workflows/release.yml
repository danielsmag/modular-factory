name: release
run-name: ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag this run publishes
        required: true
        type: string
      sha:
        description: Master commit CI verified
        required: true
        type: string

# CI on master dispatches this with the version, so the run is named vX.Y.Z.
# Master requires a pull request, so the job squash-merges release-vX.Y.Z
# instead of pushing the version commit to master itself.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cut release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: python scripts/cut_release.py

  # PyPI trusted publishing. On pypi.org, add a pending publisher for
  # modular-factory: owner danielsmag, repository modular-factory,
  # workflow release.yml, environment pypi. Create the GitHub environment too.
  pypi:
    name: publish ${{ inputs.version }}
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the package
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
