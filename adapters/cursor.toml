# Cursor adapter: where its files go and the default model and effort per step.

name = "cursor"
label = "Cursor"
cli = "cursor-agent"

[paths]
agents = ".cursor/agents"
skill = ".agents/skills/factory"
# Cursor also loads the other tools' folders, so `factory sync` writes it no second copy.
reads_skills = [".agents/skills", ".cursor/skills", ".claude/skills", ".codex/skills"]

[agents]
format = "cursor"
intake = "reply"    # `readonly` also blocks writing intake.md, so intake returns it as its reply

[efforts]
allowed = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

# `inherit` runs a step on the model of the session that starts the factory.
# Which model IDs you can name depends on your Cursor plan, so the defaults
# name none. Set them per step in factory.toml under [models.cursor].
[models]
default           = { model = "inherit" }
intake            = { model = "inherit" }
spec              = { model = "inherit" }
build             = { model = "inherit" }
debug             = { model = "inherit" }
reviewer-code     = { model = "inherit" }
reviewer-security = { model = "inherit" }
reviewer-ux       = { model = "inherit" }
reviewer-ui       = { model = "inherit" }
approve           = { model = "inherit" }
verify            = { model = "inherit" }
