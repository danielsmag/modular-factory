# Codex adapter: where its files go and the default model and effort per step.

name = "codex"
label = "Codex"
cli = "codex"

[paths]
agents = ".codex/agents"
skill = ".agents/skills/mfactory"
reads_skills = [".agents/skills"]

[agents]
format = "codex"
intake = "reply"    # intake's shell is switched off, so it returns intake.md as its reply

[efforts]
allowed = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

# `inherit` leaves the model to the session that starts the factory; the
# effort is still set per step. In factory.toml, set [models.codex] `default`
# to name a model for every step, or a step's own entry.
[models]
default           = { model = "inherit", effort = "medium" }
intake            = { effort = "high" }
spec              = { effort = "medium" }
build             = { effort = "high" }
debug             = { effort = "high" }
reviewer-code     = { effort = "medium", low = { effort = "low" } }
reviewer-security = { effort = "high" }
reviewer-ux       = { effort = "medium" }
reviewer-ui       = { effort = "low" }
approve           = { effort = "high" }
verify            = { effort = "medium" }
